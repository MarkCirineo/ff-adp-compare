# ==================================
# ADP Scout — Nginx Site Configuration
# ==================================
# Copy this file to your nginx sites directory:
#   sudo cp nginx/nginx.conf /etc/nginx/sites-available/adpscout
#   sudo ln -s /etc/nginx/sites-available/adpscout /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream adpscout {
    server 127.0.0.1:3003;
}

server {
    listen 80;
    server_name _;

    # ---------- Gzip compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ---------- Next.js static assets (immutable, long cache) ----------
    location /_next/static/ {
        proxy_pass http://adpscout;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------- Everything else → Next.js ----------
    location / {
        proxy_pass http://adpscout;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
