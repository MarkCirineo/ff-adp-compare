# ==================================
# ADP Scout — Docker Compose
# ==================================
# Usage:
#   docker compose up -d --build     # Build & start everything
#   docker compose logs -f app       # Tail app logs
#   docker compose exec app npx prisma db seed              # Seed DB (first time)
#   docker compose exec app npx tsx src/connector/cli.ts    # Sync ADP data
#   docker compose down              # Stop everything
#   docker compose down -v           # Stop + delete DB volume

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---- Next.js App ----
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3003:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    networks:
      - internal

volumes:
  pgdata:

networks:
  internal:
