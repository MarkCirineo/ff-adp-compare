# ==================================
# ADP Scout — Docker Compose
# ==================================
# Usage:
#   docker compose up -d --build     # Build & start everything
#   docker compose logs -f app       # Tail app logs
#   docker compose exec app npx prisma db seed              # Seed DB (first time)
#   docker compose exec app npx tsx src/connector/cli.ts    # Sync ADP data
#   docker compose down              # Stop everything
#   docker compose down -v           # Stop + delete DB volume

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file: .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ---- Next.js App ----
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    networks:
      - internal

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  pgdata:
  certbot-webroot:
  certbot-certs:

networks:
  internal:
